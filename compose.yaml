
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_siem}
      POSTGRES_USER: ${POSTGRES_USER:-siem_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-siem_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mini_siem}
      DEMO_LOG_PATH: /app/demo_logs/docker-demo-auth.log
    command: ["python", "-m", "app.init_db"]
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-siem_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mini_siem}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  demo-collector:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-siem_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mini_siem}
      DEMO_LOG_PATH: /app/demo_logs/docker-demo-auth.log
      DEMO_BURST_COUNT: ${DEMO_BURST_COUNT:-5}
      DEMO_BURST_DELAY_SECONDS: ${DEMO_BURST_DELAY_SECONDS:-0.8}
    command: ["python", "-m", "app.run_demo_collector"]
    volumes:
      - demo_logs:/app/demo_logs
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  demo_logs:
